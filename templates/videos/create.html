{% extends 'base.html' %}

{% block title %}{{ title }} - Ta'lim Tizimi{% endblock %}

{% block content %}
<div class="container py-4">
    <h1 class="h2 mb-4">
        <i class="fas fa-video me-3 text-primary"></i>{{ title }}
    </h1>

    <div class="card">
        <div class="card-body">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="{{ form.title.id_for_label }}" class="form-label">Video nomi</label>
                    {{ form.title }}
                </div>
                <div class="mb-3">
                    <label for="{{ form.description.id_for_label }}" class="form-label">Tavsif</label>
                    {{ form.description }}
                </div>
                <div class="mb-3">
                    <label for="{{ form.file.id_for_label }}" class="form-label">Video fayl</label>
                    {{ form.file }}
                </div>
                <div class="mb-3">
                    <label for="{{ form.subject.id_for_label }}" class="form-label">Fan</label>
                    {{ form.subject }}
                </div>
                <div class="d-flex justify-content-end">
                    <a href="{% url 'videos' %}" class="btn btn-secondary me-2">Bekor qilish</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save me-2"></i>Saqlash
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
.card-body {
    max-width: 600px;
    margin: 0 auto;
}
</style>
{% endblock %}
